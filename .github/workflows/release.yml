name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-preflight:
    name: Check release signing inputs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check signing inputs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm release:secrets:check

  release-windows:
    name: Build and publish Windows release
    runs-on: windows-latest
    needs: release-preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if (-not $version) {
            throw "VERSION is empty."
          }
          "KNOWNEXT_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KNOWNEXT_RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run release gate
        run: pnpm release:check

      - name: Import Windows code signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "WINDOWS_CERTIFICATE secret is not configured; Windows Authenticode signing will be skipped."
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD secret is required when WINDOWS_CERTIFICATE is configured."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "knownext-windows-signing.pfx"
          [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE) | Set-Content -LiteralPath $certificatePath -AsByteStream
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          if (-not $certificate.Thumbprint) {
            throw "Imported Windows signing certificate did not expose a thumbprint."
          }

          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_TIMESTAMP_URL=http://timestamp.digicert.com" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Tauri Windows release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.KNOWNEXT_RELEASE_TAG }}
          releaseName: KnowNext.ai ${{ env.KNOWNEXT_RELEASE_VERSION }}
          releaseBody: See docs/releases for the release notes and installable assets.
          releaseDraft: true
          prerelease: false
          tauriScript: pnpm tauri
          includeUpdaterJson: true
          updaterJsonPreferNsis: false

  release-android:
    name: Build and upload Android private APK
    runs-on: ubuntu-latest
    needs:
      - release-preflight
      - release-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release version
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          if [ -z "$VERSION" ]; then
            echo "VERSION is empty." >&2
            exit 1
          fi
          echo "KNOWNEXT_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "KNOWNEXT_RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Restore Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required for Android private APK releases." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/knownext-android-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/knownext-android-release.jks" >> "$GITHUB_ENV"

      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KNOWNEXT_ANDROID_ABI: arm64
          KNOWNEXT_ANDROID_API_LEVEL: "35"
        run: pnpm android:build:release

      - name: Create Android update manifest
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          APK="output/KnowNext.ai-android-arm64-v${VERSION}.apk"
          node scripts/create-android-update-manifest.mjs \
            --apk "$APK" \
            --out output/android-latest.json \
            --version "$VERSION" \
            --abi arm64-v8a \
            --url "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/$(basename "$APK")" \
            --notes-url "https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"

      - name: Upload Android release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$KNOWNEXT_RELEASE_TAG" output/KnowNext.ai-android-arm64-v*.apk output/android-latest.json --clobber
