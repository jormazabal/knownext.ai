[package]
name = "knownext-docs"
version = "2.5.1"
edition = "2021"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
knownext-core = { path = "../knownext-core" }
roxmltree = "0.20"
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ttf-parser = "0.25.1"
printpdf = { version = "0.9.1", default-features = false, features = ["images", "png", "jpeg", "gif", "webp"] }
lopdf_reader = { package = "lopdf", version = "=0.46.0", default-features = false }

[dev-dependencies]
lopdf = { version = "0.39.0", default-features = false }
