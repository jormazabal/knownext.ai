[package]
name = "knownext-docs"
version = "2.5.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
knownext-core = { path = "../knownext-core" }
roxmltree = "0.20"
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
printpdf = { version = "0.9.1", features = ["images", "png", "jpeg", "gif", "webp"] }
