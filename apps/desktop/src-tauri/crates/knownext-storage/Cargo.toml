[package]
name = "knownext-storage"
version = "2.5.1"
edition = "2021"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
fs2 = "=0.4.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
knownext-ai = { path = "../knownext-ai" }
knownext-ai-skills = { path = "../knownext-ai-skills" }
knownext-core = { path = "../knownext-core" }
knownext-drawing = { path = "../knownext-drawing" }
knownext-docs = { path = "../knownext-docs" }
knownext-recording = { path = "../knownext-recording" }
knownext-research = { path = "../knownext-research" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
quick-xml = "0.38"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
unicase = "2.9"
unicode-normalization = "0.1"
time = { version = "0.3", features = ["formatting", "parsing"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"
