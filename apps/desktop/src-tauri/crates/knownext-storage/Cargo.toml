[package]
name = "knownext-storage"
version = "2.5.1"
edition = "2021"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
knownext-ai = { path = "../knownext-ai" }
knownext-ai-skills = { path = "../knownext-ai-skills" }
knownext-core = { path = "../knownext-core" }
knownext-docs = { path = "../knownext-docs" }
knownext-research = { path = "../knownext-research" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
