// Keep this file portable across developer machines and CI runners.
// Tauri generates absolute cargo-registry paths here; those break as soon as the
// Android project is built outside the machine that ran `tauri android init`.
def cargoHome = System.getenv('CARGO_HOME') ?: new File(System.getProperty('user.home'), '.cargo').absolutePath
def cargoRegistrySrc = new File(cargoHome, 'registry/src')
def cargoLock = new File(rootDir, '../../Cargo.lock')

def cargoCrateVersion = { String crateName ->
    if (!cargoLock.isFile()) {
        throw new GradleException("Cargo.lock not found at ${cargoLock}. Run this build from the generated Android project.")
    }
    def escapedName = java.util.regex.Pattern.quote(crateName)
    def matcher = (cargoLock.text =~ /(?ms)^\[\[package\]\]\s*\nname = "${escapedName}"\s*\nversion = "([^"]+)"/)
    if (!matcher.find()) {
        throw new GradleException("Could not resolve cargo crate '${crateName}' from ${cargoLock}.")
    }
    return matcher.group(1)
}

def cargoCrateDir = { String crateName ->
    def version = cargoCrateVersion(crateName)
    def expectedDirName = "${crateName}-${version}"
    def matches = []

    if (cargoRegistrySrc.isDirectory()) {
        cargoRegistrySrc.eachDir { registryIndex ->
            def candidate = new File(registryIndex, expectedDirName)
            if (candidate.isDirectory()) {
                matches << candidate
            }
        }
    }

    if (matches.isEmpty()) {
        throw new GradleException("Cargo crate '${expectedDirName}' was not found under ${cargoRegistrySrc}. Run cargo build before Gradle.")
    }
    return matches[0]
}

include ':tauri-android'
project(':tauri-android').projectDir = new File(cargoCrateDir('tauri'), 'mobile/android')
include ':tauri-plugin-dialog'
project(':tauri-plugin-dialog').projectDir = new File(cargoCrateDir('tauri-plugin-dialog'), 'android')
include ':tauri-plugin-shell'
project(':tauri-plugin-shell').projectDir = new File(cargoCrateDir('tauri-plugin-shell'), 'android')
