[package]
name = "knownext-ai-desktop"
version = "2.5.1"
description = "KnowNext.ai desktop application"
authors = ["KnowNext.ai contributors"]
license = "Apache-2.0"
repository = "https://github.com/jormazabal/knownext.ai"
edition = "2021"

[workspace]
members = [
  ".",
  "crates/knownext-ai",
  "crates/knownext-ai-skills",
  "crates/knownext-core",
  "crates/knownext-docs",
  "crates/knownext-research",
  "crates/knownext-storage",
]
resolver = "2"

[lib]
name = "knownext_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
time = { version = "0.3", features = ["formatting"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
knownext-core = { path = "crates/knownext-core" }
knownext-storage = { path = "crates/knownext-storage" }
