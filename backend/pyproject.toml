[project]
name = "knownext-backend"
version = "1.0.0"
description = "FastAPI backend for KnowNext.ai local desktop services."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "markdown-it-py>=3.0.0",
  "mdit-py-plugins>=0.4.2",
  "openai>=1.84.0",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.20",
  "reportlab>=4.2.5",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "websockets>=14.0"
]

[project.optional-dependencies]
test = [
  "httpx>=0.27.2",
  "pytest>=8.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
